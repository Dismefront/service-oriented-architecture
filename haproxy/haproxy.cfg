global
    maxconn 4096

defaults
    mode tcp
    timeout connect 10s
    timeout client 1m
    timeout server 1m

frontend https_front
    bind *:443
    default_backend https_back

backend https_back
    balance roundrobin
    server app1 host.docker.internal:23169 check
    server app2 host.docker.internal:23170 check
